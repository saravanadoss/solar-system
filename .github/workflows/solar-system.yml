name: Solar System Worflow

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/*'
env:
   MONGO_URI: 'monogodb+srv://supercluster.db3jj.monogodb.net/superData'
   MONGO_USERNAME: ${{ vars.MONGO_USERNAME }}
   MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }} 

jobs:
    unit-testing:
        name: unit testing
        runs-on: ubuntu-latest
        steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        
        - name: Setup NodeJS Version - 18
          uses: actions/setup-node@v3
          with:
            node-version: 18

        - name: Install Dependencies
          run: npm install

        - name: Unit Testing
          run: npm test

          
         

        
        
        

      
            
        

